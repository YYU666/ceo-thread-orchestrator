interface:
  display_name: "CEO Flow"
  short_description: "PRD-to-Core-Team workflow for Codex"
  default_prompt: "Use $ceo-thread-orchestrator (CEO Flow) to manage this project as CEO/PM: treat the PRD or task-graph thread as the CEO lane, turn accepted plans into a lightweight Core Team execution wave, coordinate specialist implementation/review/product/knowledge lanes across current Codex app threads when tools are available, deliver substantial PRDs/task graphs/task-card packs/audit reports/review reports as project documents instead of long chat output, plan unattended-safe command approval profiles before dispatch, classify knowledge provider mode as none/project-memory/zhixia-local-docs/guardian-history/hybrid, act as a runtime context governor by sending compact task packets instead of long chat history, use Zhixia for current project context and Guardian only for old Codex history, paused tasks, history evidence, health/context pressure, and restore dry-runs, never treat Guardian as automatic cleanup or process pruning, harvest worker results on a cadence, keep routine in-scope approvals inside the CEO lane, keep independent review gates neutral and high-reasoning when possible, dispatch the next unblocked tasks, dynamically scale and reuse threads by task graph and write-set, support project-specified local knowledge paths, keep a lightweight team roster and evidence memory cards, avoid automatic queues or supervisor loops unless the project explicitly provides them, verify evidence before acceptance, and keep knowledge updated."
