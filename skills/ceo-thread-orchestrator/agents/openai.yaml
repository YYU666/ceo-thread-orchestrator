interface:
  display_name: "CEO Flow"
  short_description: "PRD-to-Core-Team workflow for Codex"
  default_prompt: "Use $ceo-thread-orchestrator (CEO Flow) to manage this project as CEO/PM: treat the PRD or task-graph thread as the CEO lane, turn accepted plans into a lightweight Core Team execution wave, coordinate specialist implementation/review/product/knowledge lanes across current Codex app threads when tools are available, harvest worker results on a cadence, keep routine in-scope approvals inside the CEO lane, dispatch the next unblocked tasks, dynamically scale and reuse threads by task graph and write-set, use Zhixia/zhixia-local-docs as the recommended knowledge provider when available, support project-specified local knowledge paths, keep a lightweight team roster and evidence memory cards, avoid automatic queues or supervisor loops unless the project explicitly provides them, verify evidence before acceptance, and keep knowledge updated."
